name: cmdpal-release

# Builds the Command Palette extension when a tag like cmdpal-v0.1.0 is pushed, and attaches
# the x64 and ARM64 MSIX packages to a draft GitHub release. These packages are unsigned:
# upload them to Partner Center, which signs them, then swap the Store-signed packages into
# the release before publishing it. See cmdpal/RELEASING.md.

on:
  push:
    tags: ["cmdpal-v*"]

permissions:
  contents: write  # create the draft release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Set package version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^cmdpal-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like cmdpal-v1.2.3, got ${{ github.ref_name }}" }
          $manifest = "cmdpal/MarcFinderExtension/Package.appxmanifest"
          [xml]$xml = Get-Content $manifest
          $xml.Package.Identity.Version = "$version.0"
          $xml.Save((Resolve-Path $manifest))
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build MSIX packages
        shell: pwsh
        working-directory: cmdpal/MarcFinderExtension
        run: |
          foreach ($platform in "x64", "ARM64") {
            dotnet build -c Release -p:Platform=$platform -p:GenerateAppxPackageOnBuild=true `
              -p:AppxPackageSigningEnabled=false "-p:AppxPackageDir=..\AppPackages\$platform\"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force ..\release | Out-Null
          Get-ChildItem ..\AppPackages -Recurse -Filter *.msix | Copy-Item -Destination ..\release

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem cmdpal/release/*.msix).FullName `
            --draft --latest=false --title "Command Palette extension ${{ steps.version.outputs.version }}" `
            --notes "marcfinder for PowerToys Command Palette. Install with: winget install mikegsaunders.marcfinder"
