name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    # cmdpal-v* releases are the Command Palette extension, not the Python package
    if: ${{ !startsWith(github.event.release.tag_name, 'cmdpal-') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --extra dev pytest -q
      - run: uv build
      - run: uv publish
